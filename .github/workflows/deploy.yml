name: Beta CD / Deploy

on:
  push:
    tags:
      - 'v*.*.*-beta.*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm install --ignore-scripts --legacy-peer-deps

    - name: Build Webpack Bundle
      run: npm run build

    - name: Deploy to GitHub Pages (Beta Environment)
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        destination_dir: beta
        keep_files: true
